<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yiwen's Reports</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-hover: #273548;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --accent3: #a78bfa;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== Animated Background ===== */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(56,189,248,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(129,140,248,0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(167,139,250,0.06) 0%, transparent 50%);
        }
        .bg-grid::after {
            content: "";
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== Layout ===== */
        .container {
            position: relative; z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        /* ===== Hero ===== */
        .hero {
            text-align: center;
            margin-bottom: 64px;
        }
        .avatar {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            box-shadow: 0 0 40px rgba(56,189,248,0.2);
        }
        .hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        .hero .subtitle {
            font-size: 1.1rem;
            color: var(--muted);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ===== Stats Bar ===== */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 32px 0 48px;
        }
        .stat {
            text-align: center;
        }
        .stat .num {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }
        .stat .label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ===== Section Title ===== */
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .section-title h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .section-title .line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ===== Report Cards ===== */
        .reports {
            display: grid;
            gap: 16px;
        }
        .report-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 28px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .report-card::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.25s;
        }
        .report-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(56,189,248,0.1);
        }
        .report-card:hover::before {
            opacity: 1;
        }
        .report-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .report-icon.blue { background: rgba(56,189,248,0.12); }
        .report-icon.purple { background: rgba(129,140,248,0.12); }
        .report-icon.green { background: rgba(52,211,153,0.12); }
        .report-icon.amber { background: rgba(251,191,36,0.12); }
        .report-icon.rose { background: rgba(251,113,133,0.12); }
        .report-info { flex: 1; min-width: 0; }
        .report-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .report-info p {
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.5;
        }
        .report-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(56,189,248,0.1);
            color: var(--accent);
            white-space: nowrap;
        }
        .arrow {
            color: var(--muted);
            font-size: 1.2rem;
            transition: transform 0.2s, color 0.2s;
        }
        .report-card:hover .arrow {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* ===== Empty State ===== */
        .empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
            border: 2px dashed var(--border);
            border-radius: 16px;
        }
        .empty .icon { font-size: 32px; margin-bottom: 12px; }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            margin-top: 64px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .hero h1 { font-size: 1.8rem; }
            .stats { gap: 24px; }
            .stat .num { font-size: 1.4rem; }
            .report-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 20px;
            }
            .report-meta { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<div class="container">

    <!-- Hero -->
    <div class="hero">
        <div class="avatar">📋</div>
        <h1>Yiwen's Reports</h1>
        <p class="subtitle">调研报告、技术文档与研究笔记的集合站。所有报告均为单文件 HTML，可直接在浏览器中阅读。</p>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat">
            <div class="num" id="report-count">1</div>
            <div class="label">份报告</div>
        </div>
        <div class="stat">
            <div class="num">∞</div>
            <div class="label">持续更新</div>
        </div>
    </div>

    <!-- Reports Section -->
    <div class="section-title">
        <h2>📑 报告列表</h2>
        <div class="line"></div>
    </div>

    <div class="reports">

        <!-- Report 1 -->
        <a href="reports/ai-exam-item-generation-report.html" class="report-card">
            <div class="report-icon blue">🎓</div>
            <div class="report-info">
                <h3>AI 试卷出题范式、论文结构与系统搭建报告（修订版）</h3>
                <p>涵盖四类主流范式、流程编排、可参考设计点与落地风险分析，内含 6 篇上传论文结构拆解与 2024+ 英文文献补充。</p>
            </div>
            <div class="report-meta">
                <span class="tag">AI · 教育</span>
                <span class="arrow">→</span>
            </div>
        </a>

        <!-- Future reports will be added here -->

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>Built with ☕ by <a href="https://github.com/CODE-BULIAO">CODE-BULIAO</a> · Powered by GitHub Pages</p>
    </div>

</div>

<script>
    // Auto count reports
    document.getElementById('report-count').textContent =
        document.querySelectorAll('.report-card').length;
</script>

</body>
</html>
